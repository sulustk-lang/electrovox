plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = project.mod_version
group = project.mod_group
base { archivesName = project.mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.createmod.net' }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            jvmArguments.addAll('-Dmixin.debug.verbose=true', '-Dmixin.debug.export=true')
            programArguments.addAll('--quickPlaySingleplayer', 'evtest')
        }
        server {
            server()
        }
    }

    mods {
        electrovox {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Third-party mod jars are not committed. Run ./fetch-libs.sh once.
    fileTree('libs').matching { include '*.jar' }.each { jar ->
        if (jar.name.startsWith('sable-companion')) {
            compileOnly files(jar)
        } else {
            implementation files(jar)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.mod_version
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : project.mod_id,
            'Specification-Vendor'   : project.mod_group,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.version,
            'Implementation-Vendor'  : project.mod_group
        ])
    }
}
