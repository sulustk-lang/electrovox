// ПУТЬ: electrovox/build.gradle
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Настройка Java 21, так как Minecraft 1.21.1 требует эту версию
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    // Указываем версию NeoForge из gradle.properties
    version = project.neo_version
    // Включаем генерацию данных (датаген)
