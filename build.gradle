    //     data {
    //         data()
    //         programArguments.addAll '--mod', project.mod_id, '--all',
    //                 '--output', file('src/generated/resources/').getAbsolutePath(),
    //                 '--existing', file('src/main/resources/').getAbsolutePath()
    //     }
    // }
}

// --- Зависимости ---
dependencies {
    // Здесь будут зависимости от Create и CEE.
    // Пример:
    // implementation "com.simibubi.create:create-1.21.1:6.0.0:all"
    // implementation "com.george_vi:electroenergetics:0.5.0"
}
