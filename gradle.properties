# ПУТЬ: electrovox/gradle.properties
# Параметры памяти для Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.debug=false

# Версия Minecraft и NeoForge
# Актуальную версию NeoForge можно посмотреть здесь: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
neo_version=21.1.235

# Диапазон версий загрузчика модов
loader_version_range=[1,)

# Свойства мода
mod_id=electrovox
mod_name=ElectroVox
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.electrovox
